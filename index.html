<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kick Zone Coach</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <div id="root" class="relative z-10 bg-slate-950"></div>

    <script type="module">
        // --- DATABASE LOCALE OFFLINE POTENZIATO (INDEXED_DB) ---
        const appId = 'kick-zone-coach-local';
        const dbName = 'KickZoneDB';
        const storeName = 'collections';

        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(dbName, 1);
                request.onerror = (e) => reject(e.target.error);
                request.onsuccess = (e) => resolve(e.target.result);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(storeName)) {
                        db.createObjectStore(storeName);
                    }
                };
            });
        };

        const getLocalData = async (path) => {
            const key = appId + '_' + path;
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readonly');
                const store = tx.objectStore(storeName);
                const request = store.get(key);
                request.onsuccess = () => resolve(request.result || {});
                request.onerror = () => reject(request.error);
            });
        };

        const setLocalData = async (path, data) => {
            const key = appId + '_' + path;
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                const request = store.put(data, key);
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        };

        const getAllData = async () => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readonly');
                const store = tx.objectStore(storeName);
                const request = store.getAll();
                const keyRequest = store.getAllKeys();
                
                keyRequest.onsuccess = () => {
                    const keys = keyRequest.result;
                    request.onsuccess = () => {
                        const values = request.result;
                        const result = {};
                        for(let i = 0; i < keys.length; i++) {
                            result[keys[i]] = values[i];
                        }
                        resolve(result);
                    };
                };
                keyRequest.onerror = () => reject(keyRequest.error);
            });
        };

        // RECUPERO AUTOMATICO DEI DATI VECCHI!
        const migrateFromLocalStorage = async () => {
            const migratedKey = 'kzc_migrated_to_idb_v4_recovery';
            if (localStorage.getItem(migratedKey)) return;
            
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                try {
                    if (!key) continue;
                    const val = localStorage.getItem(key);
                    const data = JSON.parse(val);
                    
                    // Identifica se è un dizionario (le nostre collezioni salvate)
                    if (typeof data === 'object' && data !== null && !Array.isArray(data)) {
                        // Verifica tutti i prefissi vecchi che potremmo aver usato
                        if (key.startsWith('kick-zone-coach-local_')) {
                            let path = key.substring('kick-zone-coach-local_'.length);
                            await setLocalData(path, data);
                        } 
                        else if (key.startsWith('team-manager-app_')) {
                            let path = key.substring('team-manager-app_'.length);
                            await setLocalData(path, data);
                        }
                        else if (key.includes('artifacts/') && key.includes('/users/')) {
                            await setLocalData(key, data);
                        }
                    }
                } catch (e) { /* skip file non compatibili */ }
            }
            localStorage.setItem(migratedKey, 'true');
        };

        const listeners = {};
        const notifyListeners = async (collectionPath) => {
            if (listeners[collectionPath] && listeners[collectionPath].length > 0) {
                const data = await getLocalData(collectionPath);
                const snapshot = {
                    docs: Object.values(data).map(item => ({ id: item.id, data: () => item }))
                };
                listeners[collectionPath].forEach(callback => callback(snapshot));
            }
        };

        const auth = { currentUser: { uid: 'local-coach-user' } };
        
        const signInAnonymously = async () => {
            await migrateFromLocalStorage();
            return { user: { uid: 'local-coach-user' } };
        };

        const db = {};
        const collection = (db, ...pathSegments) => ({ path: pathSegments.join('/') });
        const doc = (db, ...pathSegments) => ({ path: pathSegments.join('/') });

        const setDoc = async (docRef, data) => {
            const pathParts = docRef.path.split('/');
            const id = pathParts.pop();
            const collectionPath = pathParts.join('/');
            const collectionData = await getLocalData(collectionPath);
            collectionData[id] = data;
            await setLocalData(collectionPath, collectionData);
            await notifyListeners(collectionPath);
        };

        const deleteDoc = async (docRef) => {
            const pathParts = docRef.path.split('/');
            const id = pathParts.pop();
            const collectionPath = pathParts.join('/');
            const collectionData = await getLocalData(collectionPath);
            delete collectionData[id];
            await setLocalData(collectionPath, collectionData);
            await notifyListeners(collectionPath);
        };

        const onSnapshot = (collectionRef, callback) => {
            const path = collectionRef.path;
            if (!listeners[path]) listeners[path] = [];
            listeners[path].push(callback);
            
            getLocalData(path).then(data => {
                const snapshot = {
                    docs: Object.values(data).map(item => ({ id: item.id, data: () => item }))
                };
                if (listeners[path] && listeners[path].includes(callback)) {
                    callback(snapshot);
                }
            });

            return () => {
                if (listeners[path]) {
                    listeners[path] = listeners[path].filter(cb => cb !== callback);
                }
            };
        };

        window.firebaseDependencies = { auth, db, signInAnonymously, doc, setDoc, deleteDoc, onSnapshot, collection, appId, getAllData, setLocalData };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconUsers = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
        const IconCalendarCheck = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="m9 16 2 2 4-4"/></svg>;
        const IconDumbbell = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m14.5 17.5-6-6"/><path d="m9.5 22.5-6-6"/><path d="m22.5 9.5-6-6"/><path d="m18 10-6-6"/><path d="m10 18-6-6"/><path d="m13.5 13.5-6-6"/><path d="m18.5 8.5-6-6"/></svg>;
        const IconClipboardList = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>;
        const IconPlus = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
        const IconCheckCircle = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
        const IconXCircle = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>;
        const IconActivity = () => <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>;
        const IconDownload = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
        const IconSearch = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
        const IconUpload = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;
        const IconImage = () => <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>;

        function App() {
            const [activeTab, setActiveTab] = useState('rosa'); 
            const [user, setUser] = useState(null);
            const [players, setPlayers] = useState([]);
            const [events, setEvents] = useState([]);
            const [drills, setDrills] = useState([]);
            const [sessions, setSessions] = useState([]);

            useEffect(() => {
                const init = setInterval(() => {
                    if (window.firebaseDependencies) {
                        clearInterval(init);
                        window.firebaseDependencies.signInAnonymously().then(cred => {
                            setUser(cred.user);
                        });
                    }
                }, 100);
            }, []);

            const handleExport = async () => {
                try {
                    const allData = await window.firebaseDependencies.getAllData();
                    const dataToExport = {};
                    const appIdPrefix = window.firebaseDependencies.appId + '_';
                    
                    for (const key in allData) {
                        if (key.startsWith(appIdPrefix)) {
                            dataToExport[key] = allData[key];
                        }
                    }
                    
                    // NUOVO SISTEMA (BLOB) PER SCARICARE BACKUP ENORMI IN MODO SICURO
                    const jsonString = JSON.stringify(dataToExport);
                    const blob = new Blob([jsonString], { type: "application/json" });
                    const url = URL.createObjectURL(blob);
                    
                    const downloadAnchorNode = document.createElement('a');
                    downloadAnchorNode.setAttribute("href", url);
                    downloadAnchorNode.setAttribute("download", "kickzone_backup_" + new Date().toISOString().split('T')[0] + ".json");
                    document.body.appendChild(downloadAnchorNode);
                    downloadAnchorNode.click();
                    downloadAnchorNode.remove();
                    URL.revokeObjectURL(url); // Libera la memoria del browser
                    
                } catch (e) {
                    alert("Errore durante l'esportazione: " + e.message);
                }
            };

            const handleImport = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        const appIdPrefix = window.firebaseDependencies.appId + '_';
                        
                        for (const key of Object.keys(importedData)) {
                            if (key.startsWith(appIdPrefix)) {
                                const path = key.substring(appIdPrefix.length);
                                let dataToSave = importedData[key];
                                if (typeof dataToSave === 'string') {
                                    try { dataToSave = JSON.parse(dataToSave); } catch(err){}
                                }
                                await window.firebaseDependencies.setLocalData(path, dataToSave);
                            }
                        }
                        alert("Backup importato con successo!");
                        window.location.reload();
                    } catch (error) {
                        alert("Errore durante l'importazione. File non valido.");
                    }
                };
                reader.readAsText(file);
                event.target.value = '';
            };

            useEffect(() => {
                if (!user || !window.firebaseDependencies) return;
                const { db, onSnapshot, collection, appId } = window.firebaseDependencies;
                const userId = user.uid;

                const unsubPlayers = onSnapshot(collection(db, 'artifacts', appId, 'users', userId, 'players'), (snapshot) => {
                    setPlayers(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)));
                });
                const unsubEvents = onSnapshot(collection(db, 'artifacts', appId, 'users', userId, 'events'), (snapshot) => {
                    setEvents(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => new Date(b.date) - new Date(a.date)));
                });
                const unsubDrills = onSnapshot(collection(db, 'artifacts', appId, 'users', userId, 'drills'), (snapshot) => {
                    setDrills(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => {
                        const timeA = a.createdAt || parseInt(a.id.split('_')[0]) || 0;
                        const timeB = b.createdAt || parseInt(b.id.split('_')[0]) || 0;
                        return timeB - timeA; 
                    }));
                });
                const unsubSessions = onSnapshot(collection(db, 'artifacts', appId, 'users', userId, 'sessions'), (snapshot) => {
                    setSessions(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => new Date(b.date) - new Date(a.date)));
                });

                return () => { unsubPlayers(); unsubEvents(); unsubDrills(); unsubSessions(); };
            }, [user]);

            return (
                <div className="flex h-screen bg-slate-950 text-slate-200 font-sans overflow-hidden selection:bg-green-500/30">
                    <div className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col shrink-0 z-20 shadow-xl">
                        <div className="p-6 border-b border-slate-800">
                            <div className="flex items-center gap-3 text-green-500 font-bold text-xl uppercase tracking-wider">
                                <span><IconActivity /></span>
                                <span>Kick Zone Coach</span>
                            </div>
                        </div>
                        
                        <nav className="flex-1 p-4 space-y-2 overflow-y-auto">
                            <NavItem icon={IconUsers} label="Rosa" id="rosa" active={activeTab === 'rosa'} onClick={setActiveTab} />
                            <NavItem icon={IconCalendarCheck} label="Presenze" id="presenze" active={activeTab === 'presenze'} onClick={setActiveTab} />
                            <NavItem icon={IconDumbbell} label="Database Esercizi" id="esercizi" active={activeTab === 'esercizi'} onClick={setActiveTab} />
                            <NavItem icon={IconClipboardList} label="Sedute Allenamento" id="sedute" active={activeTab === 'sedute'} onClick={setActiveTab} />
                        </nav>
                        
                        <div className="p-4 border-t border-slate-800 flex flex-col gap-2 shrink-0">
                            <button onClick={handleExport} className="w-full bg-slate-800 hover:bg-slate-700 text-white text-xs py-2.5 rounded-lg flex items-center justify-center gap-2 transition-colors shadow">
                                <span><IconDownload /></span> Esporta Backup
                            </button>
                            <label className="w-full bg-slate-800 hover:bg-slate-700 text-white text-xs py-2.5 rounded-lg flex items-center justify-center gap-2 transition-colors shadow cursor-pointer">
                                <span><IconUpload /></span> Importa Backup
                                <input type="file" accept=".json" onChange={handleImport} className="hidden" />
                            </label>
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col h-full overflow-hidden relative bg-slate-950">
                        <header className="h-16 border-b border-slate-800 bg-slate-900/80 backdrop-blur flex items-center px-8 shrink-0 z-10 sticky top-0">
                            <h2 className="text-xl font-semibold capitalize text-white">
                                {activeTab.replace('-', ' ')}
                            </h2>
                        </header>

                        <main className="flex-1 overflow-y-auto p-8 relative">
                            <div className="max-w-7xl mx-auto h-full">
                                {!user ? (
                                    <div className="h-full flex items-center justify-center text-slate-500 flex-col gap-4">
                                        <div className="w-8 h-8 border-4 border-green-500 border-t-transparent rounded-full animate-spin"></div>
                                        Avvio in corso... Recupero dati...
                                    </div>
                                ) : (
                                    <>
                                        {activeTab === 'rosa' && <RosaView players={players} user={user} />}
                                        {activeTab === 'presenze' && <PresenzeView players={players} events={events} user={user} />}
                                        {activeTab === 'esercizi' && <EserciziView drills={drills} user={user} />}
                                        {activeTab === 'sedute' && <SeduteView drills={drills} sessions={sessions} user={user} />}
                                    </>
                                )}
                            </div>
                        </main>
                    </div>
                </div>
            );
        }

        function NavItem({ icon: Icon, label, id, active, onClick }) {
            return (
                <button
                    onClick={() => onClick(id)}
                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 ${
                        active ? 'bg-green-500/10 text-green-400 border border-green-500/30' : 'text-slate-400 hover:bg-slate-800 border border-transparent'
                    }`}
                >
                    <span><Icon /></span>
                    <span className="font-medium">{label}</span>
                </button>
            );
        }

        function RosaView({ players, user }) {
            const [name, setName] = useState('');
            const [position, setPosition] = useState('Centrocampista');
            const [birthDate, setBirthDate] = useState('');

            const handleAdd = async (e) => {
                e.preventDefault();
                if (!name.trim()) return;
                const { db, setDoc, doc, appId } = window.firebaseDependencies;
                const newPlayer = { id: Date.now().toString(), name, position, birthDate, createdAt: Date.now() };
                await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'players', newPlayer.id), newPlayer);
                setName(''); setBirthDate('');
            };

            const handleDelete = async (id) => {
                if(!confirm("Sicuro di voler eliminare questo giocatore?")) return;
                const { db, deleteDoc, doc, appId } = window.firebaseDependencies;
                await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'players', id));
            };

            return (
                <div className="space-y-8">
                    <div className="bg-slate-900 p-6 rounded-xl border border-slate-800 shadow-lg">
                        <h3 className="text-lg font-medium text-white mb-4 flex items-center gap-2">
                            <span><IconPlus /></span> Aggiungi Giocatore
                        </h3>
                        <form onSubmit={handleAdd} className="flex flex-wrap gap-4 items-end">
                            <div className="flex-1 min-w-[200px]">
                                <label className="block text-xs text-slate-400 mb-1">Nome e Cognome</label>
                                <input type="text" value={name} onChange={(e) => setName(e.target.value)} required className="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 outline-none text-white focus:border-green-500" />
                            </div>
                            <div className="w-48">
                                <label className="block text-xs text-slate-400 mb-1">Ruolo</label>
                                <select value={position} onChange={(e) => setPosition(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 outline-none text-white focus:border-green-500">
                                    <option>Portiere</option><option>Difensore</option><option>Centrocampista</option><option>Attaccante</option>
                                </select>
                            </div>
                            <div className="w-44">
                                <label className="block text-xs text-slate-400 mb-1">Data di Nascita</label>
                                <input type="date" value={birthDate} onChange={(e) => setBirthDate(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 outline-none text-white focus:border-green-500" />
                            </div>
                            <button type="submit" className="bg-green-600 hover:bg-green-500 text-white px-6 py-2 rounded-lg font-medium">Salva</button>
                        </form>
                    </div>

                    <div className="bg-slate-900 rounded-xl border border-slate-800 overflow-hidden shadow-lg">
                        <table className="w-full text-left">
                            <thead className="bg-slate-800/50 border-b border-slate-800 text-slate-400 text-sm">
                                <tr>
                                    <th className="px-6 py-4">Nome</th>
                                    <th className="px-6 py-4">Ruolo</th>
                                    <th className="px-6 py-4">Data Nascita</th>
                                    <th className="px-6 py-4 text-right">Azioni</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-800/50">
                                {players.length === 0 && (
                                    <tr><td colSpan="4" className="text-center py-8 text-slate-500">Nessun giocatore in rosa.</td></tr>
                                )}
                                {players.map(p => (
                                    <tr key={p.id} className="hover:bg-slate-800/20">
                                        <td className="px-6 py-4 text-white font-medium">{p.name}</td>
                                        <td className="px-6 py-4"><span className="bg-slate-800 px-2 py-1 rounded text-xs">{p.position}</span></td>
                                        <td className="px-6 py-4 text-slate-300 font-medium">{p.birthDate ? new Date(p.birthDate).toLocaleDateString('it-IT') : '-'}</td>
                                        <td className="px-6 py-4 text-right">
                                            <button onClick={() => handleDelete(p.id)} className="text-slate-500 hover:text-red-500 p-2"><span><IconTrash /></span></button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function PresenzeView({ players, events, user }) {

            const compressAndExtractBase64 = (file) => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 600; 
                            let width = img.width;
                            let height = img.height;
                            if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
                            canvas.width = width; canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            const compressed = canvas.toDataURL('image/jpeg', 0.6);
                            resolve(compressed);
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            };

            const handleBulkUpload = async (e) => {
                const fileInput = e.target;
                const files = Array.from(fileInput.files);

                            title: titleFromName,

                        await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'drills', newDrill.id), newDrill);
                        setUploadProgress({ current: i + 1, total: files.length });

                                        if (!drill) return null;
                                        return (
                                            <div key={drillId} style={{ marginBottom: '40px', borderBottom: '1px solid #e2e8f0', paddingBottom: '30px', pageBreakInside: 'avoid' }}>
                                                <div style={{ display: 'flex', alignItems: 'center', gap: '15px', marginBottom: '15px' }}>
                                                    <div style={{ backgroundColor: '#22c55e', color: 'white', width: '35px', height: '35px', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 'bold', fontSize: '16px', flexShrink: 0 }}>{idx + 1}</div>
                                                    <h3 style={{ fontSize: '22px', margin: 0, fontWeight: 'bold' }}>{drill.title}</h3>
                                                </div>
                                                
                                                {drill.description && drill.description !== 'Esercizio importato.' && (
                                                    <p style={{ fontSize: '15px', color: '#475569', lineHeight: '1.6', marginBottom: '20px', fontWeight: '500', whiteSpace: 'pre-wrap' }}>{drill.description}</p>
                                                )}
                                                
                                                {drill.image && (
                                                    <div style={{ textAlign: 'center', width: '100%' }}>
                                                        <img src={drill.image} style={{ maxWidth: '100%', maxHeight: '400px', objectFit: 'contain', borderRadius: '8px' }} />
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="w-1/2 flex flex-col gap-4">
                        <div className="bg-slate-900 p-5 rounded-xl border border-slate-800 shadow-lg shrink-0">
                            <h3 className="font-medium text-white mb-4">Pianifica Nuova Seduta</h3>
                            <form onSubmit={handleSaveSession} className="space-y-4">
                                <div className="flex gap-4">
                                    <input type="date" value={date} onChange={e => setDate(e.target.value)} required className="w-1/3 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 outline-none text-white" />
                                    <input type="text" value={title} onChange={e => setTitle(e.target.value)} required placeholder="Titolo seduta (es. Rifinitura)" className="w-2/3 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 outline-none text-white" />
                                </div>
                                
                                <div className="relative">
                                    <input type="text" placeholder="Cerca esercizio da inserire..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white outline-none" />
                                </div>

                                <div className="h-64 overflow-y-auto bg-slate-950 border border-slate-800 rounded-lg p-2 space-y-2">
                                    {filteredDrills.length === 0 && <p className="text-slate-500 text-sm text-center py-8">Nessun esercizio trovato.</p>}
                                    {filteredDrills.map(drill => (
                                        <div key={drill.id} onClick={() => toggleDrill(drill.id)} className={`p-3 rounded-lg border cursor-pointer flex items-center gap-3 ${selectedDrills.includes(drill.id) ? 'bg-green-500/10 border-green-500' : 'bg-slate-900 border-slate-800'}`}>
                                            <span>{selectedDrills.includes(drill.id) ? <span><IconCheckCircle /></span> : <div className="w-4 h-4 border border-slate-600 rounded"></div>}</span>
                                            <div className="font-medium text-sm text-white truncate">{drill.title}</div>
                                        </div>
                                    ))}
                                </div>
                                <button type="submit" disabled={selectedDrills.length === 0} className="w-full bg-green-600 disabled:bg-slate-800 text-white py-3 rounded-lg font-bold">Salva Seduta ({selectedDrills.length} Esercizi)</button>
                            </form>
                        </div>
                    </div>

                    <div className="w-1/2 flex flex-col h-full bg-slate-900 rounded-xl border border-slate-800 shadow-lg overflow-hidden relative">
                        {viewingSession ? (
                            <div className="flex flex-col h-full p-6 relative z-20 bg-slate-900">
                                <div className="absolute top-4 right-4 flex gap-2 z-30">
                                    <button onClick={() => downloadSession(viewingSession)} title="Scarica PDF" className="bg-blue-500 hover:bg-blue-600 text-white p-2 rounded-full shadow">
                                        {exportSessionData?.id === viewingSession.id ? <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> : <span><IconDownload /></span>}
                                    </button>
                                    <button onClick={() => setViewingSession(null)} className="bg-red-500 hover:bg-red-600 text-white p-2 rounded-full shadow"><span><IconXCircle /></span></button>
                                </div>
                                <h2 className="text-2xl font-bold text-white mb-6 pr-24">{viewingSession.title}</h2>
                                <div className="flex-1 overflow-y-auto space-y-4 relative z-20">
                                    {viewingSession.drillIds.map((drillId, idx) => {
                                        const drill = drills.find(d => d.id === drillId);
                                        if (!drill) return null;
                                        return (
                                            <div key={drillId} className="bg-slate-950 p-4 rounded-lg border border-slate-800">
                                                <h4 className="font-bold text-white mb-2">{idx + 1}. {drill.title}</h4>
                                                {drill.image && <img src={drill.image} className="w-full object-contain max-h-48" />}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        ) : (
                            <div className="p-4 flex-1 overflow-y-auto space-y-3">
                                <h3 className="font-medium text-white mb-4">Archivio Sedute</h3>
                                {sessions.map(session => (
                                    <div key={session.id} className="bg-slate-950 border border-slate-800 rounded-lg p-4 flex justify-between items-center cursor-pointer hover:border-slate-700" onClick={() => setViewingSession(session)}>
                                        <div>
                                            <h4 className="font-bold text-white">{session.title}</h4>
                                            <div className="text-xs text-slate-400">{new Date(session.date).toLocaleDateString('it-IT')} • {session.drillIds.length} Esercizi</div>
                                        </div>
                                        <button onClick={(e) => { e.stopPropagation(); handleDeleteSession(session.id); }} className="text-red-500 p-2"><span><IconTrash /></span></button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
